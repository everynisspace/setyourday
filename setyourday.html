<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pengatur Jadwal 24 Jam — Analog</title>
  

  <style>
        @font-face {
  font-family: 'MyFont';
  src: url('Nice_Sugar.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
    @import url('https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    :root {
      --size: 260px;
      --center: calc(var(--size) / 2);
      --hour-angle: 15deg;
      --palette: #ffe6c8, #ffcfba, #ffcb8d, #e8d0c6, #edc4a8;
    }

    * {
      box-sizing: border-box;
  font-family: 'MyFont', sans-serif;

  
    }

    body {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: linear-gradient(#fcc7a0, #ffe6c8);
      color: #9d4f2f;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* Layout */
    .app {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: space-between;
      flex-direction: column;

    width: 900px;
    }

    .panel {
      width: 320px;
      background: #eeb993;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(10,20,40,0.06);
    }

    /* Clock */
    .clock-wrap {
      width: var(--size);
      height: var(--size);
      position: relative;
    }

    .clock {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from -90deg, #fff 0deg, #fff 360deg);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -6px 18px rgba(10,20,40,0.03);
    }

    /* Tick */
    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* .tick .line {
      width: calc(var(--size)/2 + 120px);
      /* height: 0.1px;
      background: #ffffff; */


    .tick .label {
      position: absolute;
      left: calc(var(--size)/2 + -280px);
      top: -6px;
      font-size: 13px;
      font-weight: 400;
      color: #111;
      transform-origin: center;
    }

    /* Wedges overlay */
    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .wedge {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
    }

    /* Center blank */
    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      font-weight: 400;
    }

    /* List kegiatan */
    .activities {
      margin-top: 12px;
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fbfdff;
      border: 1px solid #eef2f7;
    }

    .activity-item .meta {
      font-size: 13px;
      line-height: 20px;
    }

    .activity-item button {
      background: transparent;
      border: none;
      color: #0f0f0f;
      cursor: pointer;
      font-size: 12px;
    }

    /* Form */
    label {
      display: block;
      font-size: 13px;
      margin-top: 8px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-top: 6px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * {
      flex: 1;
    }
.wiggle {
  width: 80px;
  height: 80px;
  object-fit: contain;
  animation: wiggle 2s ease-in-out infinite;
}

@keyframes wiggle {
  0% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}
    button.primary {
      margin-top: 12px;
      padding: 10px 12px;
      width: 100%;
      border-radius: 8px;
      border: none;
      background: #bd6d4c;
      color: #ffffff;
      font-weight: 400;
      cursor: pointer;
    }
.hand {
  position: absolute;
  width: 2px;
  height: calc(var(--center) - 15px);
  background: #031532;
  left: 50%;
  top: 50%;
  transform-origin: bottom center;
  transform: translate(-50%, -100%) rotate(0deg);
  border-radius: 4px;
  z-index: 5; /* di atas wedges */
}
.center {
  z-index: 1000;
  width: 120px;
  height: 120px;
  position: absolute; /* wajib biar z-index berfungsi */
}

    /* Responsive */
    @media(max-width: 900px) {
      body {
        flex-direction: column;
        align-items: center;
      }

      .app {
        flex-direction: column;
      }

      .panel {
        width: 350px;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <h3>SETTINGS YOUR DAYS</h3>
    <!-- CLOCK AREA -->
    <div class="clock-wrap">

        <div class="clock" id="clock">
  <div class="hand" id="hand"></div>

        <div class="overlay" id="overlay"></div>
        <div class="center">
           <img class="wiggle" src="image.png" alt="icon" style="width:80px; height:80px; object-fit:contain;">

        </div>
       
        
      </div>
    </div>
    <br>
     <div id="nowAct" style="display:flex; border-radius: 20px; border: 4px solid #bd6d4c; justify-content: center; align-items: center; background-color:white;width:320px; height: 40px; margin-top:-30px; text-align:center; font-size:16px;"></div>
    <div class="panel">
   

      <label>Activity</label>
      <input id="title" type="text" placeholder="" maxlength="40" />

      <div class="row">
        <div>
          <label>Start</label>
          <input id="start" type="number" min="1" max="24" value="7" />
        </div>
        <div>
          <label>Finish</label>
          <input id="end" type="number" min="1" max="24" value="8" />
        </div>
      </div>

      <button id="addBtn" class="primary">Add Activity</button>
      <div class="activities" id="list"></div>
    </div>
  </div>

  <script>
    const to24 = h => {
      h = Number(h);
      if (!Number.isFinite(h)) return 0;
      h = Math.round(h);
      if (h < 1) h = 1;
      if (h > 24) h = 24;
      return h;
    };

    const overlay = document.getElementById('overlay');
    const listEl = document.getElementById('list');
    const palette = ['#ffe6c8', '#ffcfba', '#ffcb8d', '#e8d0c6', '#edc4a8;'];

    /* Local Storage */
    function saveToLocal() {
      localStorage.setItem("activities", JSON.stringify(activities));
    }
    function loadFromLocal() {
      const data = localStorage.getItem("activities");
      return data ? JSON.parse(data) : [];
    }

    let activities = loadFromLocal();

    /* Generate ticks 1–24 */
    const clockWrap = document.querySelector('.clock-wrap');

    for (let i = 0; i < 24; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick';

      const angle = i * 15 + 90;
      tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;

      tick.innerHTML = `
        <div class="line"></div>
        <div class="label">${i === 0 ? 24 : i}</div>
      `;

      tick.querySelector('.label').style.transform = `rotate(${-angle}deg)`;
      clockWrap.appendChild(tick);
    }

    /* Render wedges */
    function renderOverlay() {
      overlay.innerHTML = '';

      activities.forEach((act, idx) => {
        const wedge = document.createElement('div');
        wedge.className = 'wedge';

        const color = palette[idx % palette.length];
        const s = act.start === 24 ? 0 : act.start % 24;
        const e = act.end === 24 ? 0 : act.end % 24;

        const startAngle = s * 15;
        let sweep = e - s;
        if (sweep <= 0) sweep += 24;
        const sweepAngle = sweep * 15;

        wedge.style.background = `conic-gradient(
          from ${startAngle}deg,
          ${color} 0deg ${sweepAngle}deg,
          transparent ${sweepAngle}deg 360deg
        )`;

        overlay.appendChild(wedge);
      });
    }

    /* Render list */
    function refreshList() {
      listEl.innerHTML = '';

      activities.forEach((act, idx) => {
        const color = palette[idx % palette.length];
        const item = document.createElement('div');
        item.className = 'activity-item';

item.style.background = color; // warna card sesuai warna kegiatan

item.innerHTML = `
  <div style="display:flex;align-items:center;gap:8px;">


    <div class="meta">
      ${act.title}
      <div style="font-size:12px;color:#666"> ${act.start}:00 — ${act.end}:00 WIB</div>
    </div>
  </div>

  <button data-i="${idx}">delete</button>
`;


        listEl.appendChild(item);
      });

      listEl.querySelectorAll('button').forEach(btn =>
        btn.addEventListener('click', e => {
          const i = Number(e.currentTarget.dataset.i);
          activities.splice(i, 1);
          saveToLocal();
          renderOverlay();
          refreshList();
        })
      );
    }

    /* Add activity */
    document.getElementById('addBtn').addEventListener('click', () => {
      const title = document.getElementById('title').value.trim();
      let start = to24(document.getElementById('start').value);
      let end = to24(document.getElementById('end').value);

      if (!title) return alert('Isi nama kegiatan!');

    // CEK BENTROK
const conflict = activities.some(a =>
  (start < a.end && end > a.start)
);

if (conflict) {
  alert("Jam tersebut sudah terpakai kegiatan lain!");
  return;
}

activities.push({ title, start, end });

      saveToLocal();

      renderOverlay();
      refreshList();
      document.getElementById('title').value = '';
    });

    /* Initial render */
    renderOverlay();
    refreshList();
function updateHand() {
  const now = new Date();
  const hours = now.getHours();
  const minutes = now.getMinutes();

  const totalHours = hours + minutes / 60;
  const angle = totalHours * 15;

  document.getElementById("hand").style.transform =
    `translate(-50%, -100%) rotate(${angle}deg)`;

  // CEK KEGIATAN YANG SEDANG BERLANGSUNG
  let current = null;

  activities.forEach(act => {
    const s = act.start;
    const e = act.end;

    if (totalHours >= s && totalHours < e) {
      current = act;
    }
  });

  const box = document.getElementById("nowAct");

  if (current) {
    box.textContent = `It's time to ${current.title}`;
  } else {
    box.textContent = "";
  }
}

updateHand();
setInterval(updateHand, 1000);
  </script>

</body>
</html>
